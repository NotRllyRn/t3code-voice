name: Voice automation check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-automation-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Voice automation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --frozen-lockfile --filter=t3... --filter=@t3tools/scripts...
          save-pnpm-store: false
      - name: Test stable-release validation, signed delivery and build gates
        run: vp test run --config scripts/voice-automation.vite.config.ts
